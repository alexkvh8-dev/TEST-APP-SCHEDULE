<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Google spec ad · HyperFrames</title>
  <!-- HyperFrames composition. The film itself is the motion engine in src/main.js
       (three.js + Canvas 2D); HyperFrames seeks it frame by frame through `hf-seek`. -->
  <script src="./node_modules/gsap/dist/gsap.min.js"></script>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
    #root { position: absolute; inset: 0; }
    #stage { position: absolute; inset: 0; }
    #stage canvas { width: 1920px !important; height: 1080px !important; display: block; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
    <div id="stage" class="clip" data-start="0" data-duration="60" data-track-index="0"></div>
  </div>
  <script>
    window.__HF_MODE = true;
    window.__timelines = window.__timelines || {};
    // The three.js engine draws from hf-seek; this paused timeline only carries the 60 s length.
    const tl = gsap.timeline({ paused: true });
    tl.set({}, {}, 60);
    window.__timelines["main"] = tl;
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
