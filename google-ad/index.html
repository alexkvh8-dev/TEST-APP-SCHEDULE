<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google spec ad · preview</title>
  <style>
    :root { --bg: #000; --fg: #fff; --mute: #9a9a9a; --accent: #ffffff; --bar: #111; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 500 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    #stage { position: absolute; inset: 0 0 56px 0; display: grid; place-items: center; }
    #stage canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; width: auto !important; height: auto !important; display: block; }
    #ui { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; gap: 12px; align-items: center; padding: 0 16px; background: var(--bar); }
    #ui button { background: var(--accent); color: #000; border: 0; border-radius: 999px; width: 36px; height: 36px; font-weight: 800; cursor: pointer; }
    #scrub { flex: 1; min-width: 0; }
    #tc { font-variant-numeric: tabular-nums; color: var(--mute); min-width: 96px; text-align: right; }
    body.render #ui { display: none; }
    body.render #stage { inset: 0; }
    body.render #stage canvas { max-width: none; max-height: none; width: 1920px !important; height: 1080px !important; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="ui">
    <button id="play" aria-label="Play or pause">▶</button>
    <input id="scrub" type="range" min="0" max="60" step="0.0333" value="0" aria-label="Timeline">
    <span id="tc">00:00.00</span>
  </div>
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/preview.js"></script>
</body>
</html>
