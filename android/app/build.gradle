plugins {
    id "com.android.application"
}

/*
 * The URL the app loads. Passed in by CI so the app can be pointed at a
 * different deployment without editing code.
 */
def appUrl = project.findProperty("finxUrl") ?: "https://test-app-schedule.vercel.app"

android {
    namespace "app.finx"
    compileSdk 34

    defaultConfig {
        applicationId "app.finx"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "APP_URL", "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "finxlocal"
            keyAlias System.getenv("KEY_ALIAS") ?: "finx"
            keyPassword System.getenv("KEY_PASSWORD") ?: "finxlocal"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // No shrinking: the app is one activity and a WebView, so R8 would
            // save a few kilobytes and add a way for the build to break.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /*
     * Pin every Kotlin artifact to one version.
     *
     * appcompat drags in kotlin-stdlib 1.8.22 while an older transitive wants
     * kotlin-stdlib-jdk8 1.6.21. Kotlin 1.8 folded the jdk7 and jdk8 stdlibs
     * into the main one, so pulling both puts the same classes in the APK
     * twice and the build refuses. The BOM lines them all up.
     */
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")

    implementation "androidx.appcompat:appcompat:1.7.0"
    // OnBackPressedCallback, declared rather than relied on transitively.
    implementation "androidx.activity:activity:1.9.3"
}
